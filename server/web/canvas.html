<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochi Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .canvas-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .canvas-body {
        display: grid;
        grid-template-columns: 1fr 224px;
        gap: 16px;
        align-items: start;
      }

      .canvas-main {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ── Toolbar ─────────────────────────────────── */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .tool-btn {
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 7px 13px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.83rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 140ms ease;
        white-space: nowrap;
      }

      .tool-btn:hover {
        color: var(--text);
        border-color: rgba(103, 232, 249, 0.35);
      }

      .tool-btn.active {
        color: var(--accent);
        border-color: rgba(103, 232, 249, 0.6);
        background: rgba(103, 232, 249, 0.08);
      }

      .tool-btn.danger {
        color: var(--danger);
        border-color: rgba(251, 113, 133, 0.35);
      }

      .tool-btn.danger:hover {
        background: rgba(251, 113, 133, 0.08);
      }

      .tool-sep {
        width: 1px;
        height: 24px;
        background: var(--panel-border);
        margin: 0 2px;
        flex-shrink: 0;
      }

      .size-group {
        display: flex;
        gap: 4px;
      }

      .size-btn {
        width: 30px;
        height: 30px;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 140ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .size-btn.active {
        color: var(--accent);
        border-color: rgba(103, 232, 249, 0.6);
        background: rgba(103, 232, 249, 0.08);
      }

      .toolbar-label {
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0 4px;
      }

      /* ── Dropdowns ───────────────────────────────── */
      .dropdown {
        position: relative;
      }

      .dropdown-menu {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 6px;
        min-width: 170px;
        z-index: 50;
        box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        backdrop-filter: blur(18px);
        flex-direction: column;
        gap: 2px;
      }

      .dropdown-menu.open {
        display: flex;
      }

      .dropdown-menu button {
        background: transparent;
        border: none;
        border-radius: 8px;
        padding: 7px 12px;
        color: var(--muted);
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
        transition: all 120ms ease;
        white-space: nowrap;
      }

      .dropdown-menu button:hover {
        background: rgba(103, 232, 249, 0.09);
        color: var(--accent);
      }

      .dropdown-menu button.selected {
        color: var(--accent);
        background: rgba(103, 232, 249, 0.06);
      }

      /* ── Drawing canvas ──────────────────────────── */
      .canvas-wrap {
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        background: #000;
        box-shadow: var(--shadow);
        padding: 20px;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }

      #drawCanvas {
        width: min(640px, 100%);
        aspect-ratio: 2 / 1;
        cursor: crosshair;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 1px solid rgba(103, 232, 249, 0.2);
        border-radius: 2px;
        display: block;
        touch-action: none;
      }

      .canvas-hint {
        font-size: 0.77rem;
        color: var(--muted);
        text-align: center;
        opacity: 0.65;
        margin: 0;
      }

      /* ── Text input overlay ──────────────────────── */
      .text-overlay {
        position: fixed;
        z-index: 200;
        display: none;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 10px 14px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        backdrop-filter: blur(18px);
      }

      .text-overlay input {
        width: 160px;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        font-size: 0.85rem;
        padding: 6px 10px;
        outline: none;
      }

      .text-overlay input:focus {
        border-color: rgba(103, 232, 249, 0.5);
      }

      .text-overlay .txt-ok {
        border: 1px solid rgba(103, 232, 249, 0.5);
        border-radius: 8px;
        padding: 6px 10px;
        background: rgba(103, 232, 249, 0.1);
        color: var(--accent);
        font: inherit;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
      }

      .text-overlay .txt-cancel {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 6px;
      }

      .text-overlay .txt-cancel:hover { color: var(--danger); }

      /* ── Sidebar ─────────────────────────────────── */
      .canvas-sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar-card {
        border: 1px solid var(--panel-border);
        border-radius: 22px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #previewCanvas {
        width: 100%;
        aspect-ratio: 2 / 1;
        border: 1px solid rgba(103, 232, 249, 0.15);
        border-radius: 2px;
        image-rendering: pixelated;
        display: block;
        background: #000;
      }

      .pixel-count {
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
        margin: 0;
      }

      .full-btn {
        width: 100%;
      }

      .status-msg {
        font-size: 0.83rem;
        color: var(--muted);
        line-height: 1.4;
        min-height: 1.2em;
        margin: 0;
      }

      .status-msg.ok    { color: var(--accent-strong); }
      .status-msg.error { color: var(--danger); }

      /* ── Device ID field ────────────────────────────── */
      .device-hint {
        font-size: 0.75rem;
        color: var(--muted);
        opacity: 0.6;
        margin: -6px 0 0;
      }

      @media (max-width: 860px) {
        .canvas-body { grid-template-columns: 1fr; }
        .canvas-sidebar { flex-direction: row; flex-wrap: wrap; }
        .sidebar-card { flex: 1; min-width: 200px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="canvas-header">
        <div>
          <p class="eyebrow">Mochi Canvas</p>
          <h2 style="margin-top: 6px; font-size: 1.6rem; letter-spacing: -0.03em">
            Pizarra OLED 128×64
          </h2>
        </div>
      </div>

      <div class="canvas-body">
        <!-- Zona de dibujo -->
        <div class="canvas-main">
          <div class="toolbar">
            <button class="tool-btn active" id="toolPencil" title="Lápiz (P)">Lápiz</button>
            <button class="tool-btn" id="toolEraser" title="Borrador (E)">Borrador</button>
            <button class="tool-btn" id="toolFill" title="Relleno (F)">Relleno</button>

            <div class="tool-sep"></div>

            <!-- Figuras dropdown -->
            <div class="dropdown">
              <button class="tool-btn" id="toolFigures" title="Figuras geométricas (G)">Figuras ▾</button>
              <div class="dropdown-menu" id="figuresMenu">
                <button data-shape="square">Cuadrado</button>
                <button data-shape="circle">Círculo</button>
                <button data-shape="triangle">Triángulo</button>
                <button data-shape="heart">Corazón</button>
                <button data-shape="cross">Cruz +</button>
                <button data-shape="x">Cruz ×</button>
              </div>
            </div>

            <!-- Texto dropdown -->
            <div class="dropdown">
              <button class="tool-btn" id="toolText" title="Texto (T)">Texto ▾</button>
              <div class="dropdown-menu" id="textMenu">
                <button data-font="small"  data-label="5×7">Small 5×7 — ~21 chars</button>
                <button data-font="medium" data-label="10×14">Medium 10×14 — ~10 chars</button>
              </div>
            </div>

            <div class="tool-sep"></div>

            <button class="tool-btn" id="toolInvert" title="Invertir colores">Invertir</button>
            <button class="tool-btn danger" id="toolClear" title="Limpiar todo">Limpiar</button>

            <div class="tool-sep"></div>

            <span class="toolbar-label">Tamaño:</span>
            <div class="size-group">
              <button class="size-btn active" data-size="1">1</button>
              <button class="size-btn" data-size="2">2</button>
              <button class="size-btn" data-size="3">3</button>
            </div>
          </div>

          <div class="canvas-wrap">
            <canvas id="drawCanvas" width="128" height="64"></canvas>
          </div>

          <p class="canvas-hint">
            P lápiz &middot; E borrador &middot; F relleno &middot; G figura &middot; T texto &middot; Ctrl+Z deshacer
          </p>
        </div>

        <!-- Barra lateral -->
        <div class="canvas-sidebar">
          <div class="sidebar-card">
            <p class="eyebrow" style="margin-bottom: 0">Vista previa</p>
            <canvas id="previewCanvas" width="128" height="64"></canvas>
            <p class="pixel-count" id="pixelCount">0 / 8192 px encendidos</p>
          </div>

          <div class="sidebar-card">
            <div class="server-field">
              <label>Device ID</label>
              <input id="deviceInput" type="text" placeholder="esp32_01" autocomplete="off" />
            </div>
            <p class="device-hint">guardado automáticamente</p>
            <button class="primary-btn full-btn" id="sendBtn">Enviar a Mochi</button>
            <button class="ghost-btn full-btn" id="exitBtn">Salir modo canvas</button>
            <p class="status-msg" id="statusMsg"></p>
          </div>
        </div>
      </div>
    </main>

    <!-- Text input overlay (aparece al hacer click con herramienta Texto) -->
    <div id="textOverlay" class="text-overlay">
      <input id="textInput" type="text" placeholder="Escribe y pulsa Enter…" maxlength="64" autocomplete="off" />
      <button class="txt-ok" id="textConfirm">OK</button>
      <button class="txt-cancel" id="textCancel">✕</button>
    </div>

    <script>
      (function () {
        'use strict';

        const canvas    = document.getElementById('drawCanvas');
        const ctx       = canvas.getContext('2d');
        const preview   = document.getElementById('previewCanvas');
        const pCtx      = preview.getContext('2d');
        const pixelCountEl  = document.getElementById('pixelCount');
        const statusEl      = document.getElementById('statusMsg');
        const deviceInput   = document.getElementById('deviceInput');

        // ── Inicialización ────────────────────────────────────────────
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 128, 64);
        syncPreview();

        deviceInput.value = localStorage.getItem('mochi_device_id') || '';

        // ── Estado ───────────────────────────────────────────────────
        let tool      = 'pencil';
        let brushSize = 1;
        let drawing   = false;
        let lastX = null, lastY = null;
        const history   = [];
        const MAX_UNDO  = 20;

        let figureShape = 'square';   // figura activa
        let textFont    = 'small';    // fuente activa

        // ── Historial ─────────────────────────────────────────────────
        function saveHistory() {
          if (history.length >= MAX_UNDO) history.shift();
          history.push(ctx.getImageData(0, 0, 128, 64));
        }

        function undo() {
          if (!history.length) return;
          ctx.putImageData(history.pop(), 0, 0);
          syncPreview();
        }

        // ── setTool ───────────────────────────────────────────────────
        function setTool(name) {
          tool = name;
          document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
          const map = { pencil: 'toolPencil', eraser: 'toolEraser', fill: 'toolFill',
                        figure: 'toolFigures', text: 'toolText' };
          if (map[name]) document.getElementById(map[name]).classList.add('active');
        }

        document.getElementById('toolPencil').addEventListener('click', () => setTool('pencil'));
        document.getElementById('toolEraser').addEventListener('click', () => setTool('eraser'));
        document.getElementById('toolFill').addEventListener('click', () => setTool('fill'));

        document.getElementById('toolInvert').addEventListener('click', () => {
          saveHistory();
          const img = ctx.getImageData(0, 0, 128, 64);
          const d = img.data;
          for (let i = 0; i < d.length; i += 4) {
            d[i] = 255 - d[i]; d[i+1] = 255 - d[i+1]; d[i+2] = 255 - d[i+2];
          }
          ctx.putImageData(img, 0, 0);
          syncPreview();
        });

        document.getElementById('toolClear').addEventListener('click', () => {
          saveHistory();
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, 128, 64);
          syncPreview();
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            brushSize = parseInt(btn.dataset.size, 10);
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });

        // ── Dropdowns ─────────────────────────────────────────────────
        function closeAllDropdowns() {
          document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
        }

        document.addEventListener('click', closeAllDropdowns);

        function toggleDropdown(menuId, e) {
          e.stopPropagation();
          const menu = document.getElementById(menuId);
          const wasOpen = menu.classList.contains('open');
          closeAllDropdowns();
          if (!wasOpen) menu.classList.add('open');
        }

        document.getElementById('toolFigures').addEventListener('click', e => toggleDropdown('figuresMenu', e));
        document.getElementById('toolText').addEventListener('click', e => toggleDropdown('textMenu', e));

        // Figuras menu
        document.querySelectorAll('#figuresMenu [data-shape]').forEach(item => {
          item.addEventListener('click', e => {
            e.stopPropagation();
            figureShape = item.dataset.shape;
            // Marcar seleccionado
            document.querySelectorAll('#figuresMenu button').forEach(b => b.classList.remove('selected'));
            item.classList.add('selected');
            // Actualizar label del botón
            document.getElementById('toolFigures').textContent = item.textContent.trim() + ' ▾';
            closeAllDropdowns();
            setTool('figure');
          });
        });

        // Texto menu
        document.querySelectorAll('#textMenu [data-font]').forEach(item => {
          item.addEventListener('click', e => {
            e.stopPropagation();
            textFont = item.dataset.font;
            document.querySelectorAll('#textMenu button').forEach(b => b.classList.remove('selected'));
            item.classList.add('selected');
            document.getElementById('toolText').textContent = 'Texto ' + item.dataset.label + ' ▾';
            closeAllDropdowns();
            setTool('text');
          });
        });

        // ── Primitivas de dibujo ──────────────────────────────────────
        function pixelPos(e) {
          const rect = canvas.getBoundingClientRect();
          const src = e.touches ? e.touches[0] : e;
          const x = Math.round(((src.clientX - rect.left) / rect.width) * 127);
          const y = Math.round(((src.clientY - rect.top) / rect.height) * 63);
          return { x: Math.max(0, Math.min(127, x)), y: Math.max(0, Math.min(63, y)) };
        }

        function paintPixel(x, y) {
          ctx.fillStyle = tool === 'eraser' ? '#000' : '#fff';
          const half = Math.floor(brushSize / 2);
          ctx.fillRect(x - half, y - half, brushSize, brushSize);
        }

        function paintLine(x0, y0, x1, y1) {
          let dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
          let dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
          let err = dx+dy;
          for(;;){
            paintPixel(x0, y0);
            if(x0===x1&&y0===y1) break;
            const e2=2*err;
            if(e2>=dy){err+=dy;x0+=sx;}
            if(e2<=dx){err+=dx;y0+=sy;}
          }
        }

        function floodFill(sx, sy) {
          const img = ctx.getImageData(0, 0, 128, 64);
          const d = img.data;
          const W = 128, H = 64;
          const fillVal  = tool === 'eraser' ? 0 : 255;
          const targetVal = d[(sy * W + sx) * 4];
          if (targetVal === fillVal) return;
          const visited = new Uint8Array(W * H);
          const stack   = [sy * W + sx];
          while (stack.length) {
            const pos = stack.pop();
            const px = pos % W, py = (pos / W) | 0;
            if (px < 0 || px >= W || py < 0 || py >= H || visited[pos]) continue;
            const i = pos * 4;
            if (d[i] !== targetVal) continue;
            visited[pos] = 1;
            d[i] = d[i+1] = d[i+2] = fillVal;
            d[i+3] = 255;
            stack.push(pos+1, pos-1, pos+W, pos-W);
          }
          ctx.putImageData(img, 0, 0);
        }

        function syncPreview() {
          pCtx.drawImage(canvas, 0, 0);
          const img = ctx.getImageData(0, 0, 128, 64);
          let count = 0;
          for (let i = 0; i < img.data.length; i += 4) if (img.data[i] > 128) count++;
          pixelCountEl.textContent = `${count} / 8192 px encendidos`;
        }

        // ── Figuras ───────────────────────────────────────────────────
        // brushSize → tamaño de la figura en px (radio / semilado)
        function getFigSz() { return [8, 14, 22][brushSize - 1]; }

        // Escribe un píxel directamente en un ImageData
        function imgPx(img, x, y, v) {
          if (x < 0 || x > 127 || y < 0 || y > 63) return;
          const i = (y * 128 + x) * 4;
          img.data[i] = img.data[i+1] = img.data[i+2] = v;
          img.data[i+3] = 255;
        }

        // Línea Bresenham sobre ImageData
        function imgLine(img, x0, y0, x1, y1, v) {
          let dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
          let dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
          let err = dx+dy;
          for(;;){
            imgPx(img, x0, y0, v);
            if(x0===x1&&y0===y1) break;
            const e2=2*err;
            if(e2>=dy){err+=dy;x0+=sx;}
            if(e2<=dx){err+=dx;y0+=sy;}
          }
        }

        function stampFigure(cx, cy) {
          const sz = getFigSz();
          const img = ctx.getImageData(0, 0, 128, 64);

          if (figureShape === 'square') {
            const h = Math.floor(sz / 2);
            const x0=cx-h, y0=cy-h, x1=cx+h, y1=cy+h;
            imgLine(img, x0,y0, x1,y0, 255);
            imgLine(img, x0,y1, x1,y1, 255);
            imgLine(img, x0,y0, x0,y1, 255);
            imgLine(img, x1,y0, x1,y1, 255);
          }

          else if (figureShape === 'circle') {
            const r = Math.floor(sz / 2);
            let x=0, y=r, d=3-2*r;
            const ring = (px, py) => {
              for (const [a,b] of [[px,py],[py,px],[-px,py],[-py,px],
                                    [px,-py],[py,-px],[-px,-py],[-py,-px]])
                imgPx(img, cx+a, cy+b, 255);
            };
            while(x<=y){ ring(x,y); if(d<0) d+=4*x+6; else{d+=4*(x-y)+10;y--;} x++; }
          }

          else if (figureShape === 'triangle') {
            const h  = Math.round(sz * 0.866);
            const tx = cx,    ty  = cy - Math.floor(h * 2 / 3);
            const bx1 = cx - Math.floor(sz / 2), by = cy + Math.ceil(h / 3);
            const bx2 = cx + Math.floor(sz / 2);
            imgLine(img, tx,ty, bx1,by, 255);
            imgLine(img, bx1,by, bx2,by, 255);
            imgLine(img, bx2,by, tx,ty, 255);
          }

          else if (figureShape === 'heart') {
            // Ecuación paramétrica del corazón escalada al tamaño
            const s = sz / 16;
            for (let deg = 0; deg <= 360; deg++) {
              const t  = deg * Math.PI / 180;
              const hx = Math.round(cx + s * 16 * Math.pow(Math.sin(t), 3));
              const hy = Math.round(cy - s * (13*Math.cos(t) - 5*Math.cos(2*t)
                                              - 2*Math.cos(3*t) - Math.cos(4*t)));
              imgPx(img, hx, hy, 255);
            }
          }

          else if (figureShape === 'cross') {
            const h = Math.floor(sz / 2);
            imgLine(img, cx-h,cy, cx+h,cy, 255);
            imgLine(img, cx,cy-h, cx,cy+h, 255);
          }

          else if (figureShape === 'x') {
            const h = Math.floor(sz / 2);
            imgLine(img, cx-h,cy-h, cx+h,cy+h, 255);
            imgLine(img, cx+h,cy-h, cx-h,cy+h, 255);
          }

          ctx.putImageData(img, 0, 0);
        }

        // ── Herramienta Texto — Adafruit GFX glcdfont 5×7 ───────────────
        // Fuente real del SH1106: glcdfont.c de Adafruit-GFX-Library.
        // 256 caracteres × 5 bytes (columnas). bit 0 = píxel superior, bit 6 = inferior.
        // Renderer pixel-a-pixel → resultado idéntico al OLED real.
        const GLCDFONT = new Uint8Array([
          0x00,0x00,0x00,0x00,0x00, 0x3E,0x5B,0x4F,0x5B,0x3E, 0x3E,0x6B,0x4F,0x6B,0x3E,
          0x1C,0x3E,0x7C,0x3E,0x1C, 0x18,0x3C,0x7E,0x3C,0x18, 0x1C,0x57,0x7D,0x57,0x1C,
          0x1C,0x5E,0x7F,0x5E,0x1C, 0x00,0x18,0x3C,0x18,0x00, 0xFF,0xE7,0xC3,0xE7,0xFF,

        // Dibuja un glifo a escala 1x o 2x sobre un ImageData existente
        function drawGlyph(code, x, y, scale, img) {
          if (code < 0 || code > 255) return;
          const base = code * 5;
          for (let col = 0; col < 5; col++) {
            const cb = GLCDFONT[base + col];
            for (let row = 0; row < 7; row++) {
              if (cb & (1 << row)) {
                for (let dy = 0; dy < scale; dy++)
                  for (let dx = 0; dx < scale; dx++)
                    imgPx(img, x + col * scale + dx, y + row * scale + dy, 255);
              }
            }
          }
        }

        function renderTextStamp(text, x, y) {
          const scale = textFont === 'medium' ? 2 : 1;
          const cw    = (5 + 1) * scale; // 5px glifo + 1px espaciado × escala
          const img   = ctx.getImageData(0, 0, 128, 64);
          let cx = x;
          for (const ch of text) {
            const code = ch.charCodeAt(0);
            drawGlyph(code, cx, y, scale, img);
            cx += cw;
          }
          ctx.putImageData(img, 0, 0);
        }

        // Overlay de entrada de texto
        const textOverlay  = document.getElementById('textOverlay');
        const textInput    = document.getElementById('textInput');
        let pendingTX = 0, pendingTY = 0;

        function showTextInput(cx, cy, rawEvent) {
          pendingTX = cx; pendingTY = cy;
          const rect = canvas.getBoundingClientRect();
          const scaleX = rect.width / 128;
          const scaleY = rect.height / 64;
          const screenX = rect.left + cx * scaleX;
          const screenY = rect.top  + cy * scaleY + window.scrollY;
          const overlayW = 280;
          textOverlay.style.left = Math.min(screenX, window.innerWidth - overlayW - 16) + 'px';
          textOverlay.style.top  = Math.max(8, screenY - 50) + 'px';
          textOverlay.style.display = 'flex';
          textInput.value = '';
          textInput.focus();
        }

        function commitText() {
          const t = textInput.value.trim();
          textOverlay.style.display = 'none';
          if (!t) return;
          saveHistory();
          renderTextStamp(t, pendingTX, pendingTY);
          syncPreview();
        }

        function cancelText() {
          textOverlay.style.display = 'none';
        }

        textInput.addEventListener('keydown', e => {
          if (e.key === 'Enter')  { e.preventDefault(); commitText(); }
          else if (e.key === 'Escape') cancelText();
        });
        document.getElementById('textConfirm').addEventListener('click', commitText);
        document.getElementById('textCancel').addEventListener('click', cancelText);
        // Clicks dentro del overlay no deben llegar al canvas
        textOverlay.addEventListener('click', e => e.stopPropagation());

        // ── Eventos de puntero ────────────────────────────────────────
        function onStart(e) {
          e.preventDefault();
          const { x, y } = pixelPos(e);

          if (tool === 'figure') {
            saveHistory();
            stampFigure(x, y);
            syncPreview();
            return;
          }

          if (tool === 'text') {
            showTextInput(x, y, e);
            return;
          }

          saveHistory();
          drawing = true;
          lastX = x; lastY = y;
          if (tool === 'fill') {
            floodFill(x, y);
          } else {
            paintPixel(x, y);
          }
          syncPreview();
        }

        function onMove(e) {
          e.preventDefault();
          if (!drawing || tool === 'fill' || tool === 'figure' || tool === 'text') return;
          const { x, y } = pixelPos(e);
          if (x === lastX && y === lastY) return;
          paintLine(lastX, lastY, x, y);
          lastX = x; lastY = y;
          syncPreview();
        }

        function onEnd() {
          drawing = false;
          lastX = lastY = null;
        }

        canvas.addEventListener('mousedown',  onStart);
        canvas.addEventListener('mousemove',  onMove);
        canvas.addEventListener('mouseup',    onEnd);
        canvas.addEventListener('mouseleave', onEnd);
        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove',  onMove,  { passive: false });
        canvas.addEventListener('touchend',   onEnd);

        // ── Teclado ───────────────────────────────────────────────────
        document.addEventListener('keydown', e => {
          if (e.target.tagName === 'INPUT') return;
          if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); return; }
          const k = e.key.toLowerCase();
          if      (k === 'p') setTool('pencil');
          else if (k === 'e') setTool('eraser');
          else if (k === 'f') setTool('fill');
          else if (k === 'g') { setTool('figure'); document.getElementById('toolFigures').classList.add('active'); }
          else if (k === 't') { setTool('text');   document.getElementById('toolText').classList.add('active'); }
        });

        // ── Conversión a bitmap SH1106 (page format) ──────────────────
        function toBitmap() {
          const px  = ctx.getImageData(0, 0, 128, 64).data;
          const out = new Uint8Array(1024);
          for (let page = 0; page < 8; page++) {
            for (let col = 0; col < 128; col++) {
              let byte = 0;
              for (let bit = 0; bit < 8; bit++) {
                const row = page * 8 + bit;
                if (px[(row * 128 + col) * 4] > 128) byte |= 1 << bit;
              }
              out[page * 128 + col] = byte;
            }
          }
          return out;
        }

        function toBase64(bytes) {
          let s = '';
          for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
          return btoa(s);
        }

        // ── Comunicación con el servidor ──────────────────────────────
        async function postCanvas(payload) {
          const base = window.location.origin;
          const res = await fetch(`${base}/canvas`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!res.ok) {
            const text = await res.text().catch(() => '');
            throw new Error(`HTTP ${res.status}${text ? ': ' + text : ''}`);
          }
          return res.json();
        }

        function setStatus(msg, cls) {
          statusEl.textContent = msg;
          statusEl.className   = 'status-msg' + (cls ? ' ' + cls : '');
        }

        const DEFAULT_DEVICE_ID = 'esp32_01';

        function getDeviceId() {
          return deviceInput.value.trim();
        }

        function saveDeviceId() {
          localStorage.setItem('mochi_device_id', getDeviceId());
        }

        function validateDeviceId() {
          const id = getDeviceId();
          if (!id) {
            setStatus('Escribe tu Device ID antes de enviar.', 'error');
            deviceInput.focus();
            return null;
          }
          if (id === DEFAULT_DEVICE_ID) {
            setStatus(`"${id}" es el valor por defecto — cambia DEVICE_ID en tu firmware.`, 'error');
            deviceInput.focus();
            return null;
          }
          return id;
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
          const device_id = validateDeviceId();
          if (!device_id) return;
          saveDeviceId();
          setStatus(`Enviando a ${device_id}...`);
          try {
            await postCanvas({ bitmap: toBase64(toBitmap()), exit: false, device_id });
            setStatus('Enviado correctamente.', 'ok');
          } catch (err) {
            setStatus('Error: ' + err.message, 'error');
          }
        });

        document.getElementById('exitBtn').addEventListener('click', async () => {
          const device_id = validateDeviceId();
          if (!device_id) return;
          saveDeviceId();
          setStatus('Saliendo del modo canvas...');
          try {
            await postCanvas({ exit: true, device_id });
            setStatus('Modo canvas desactivado.', 'ok');
          } catch (err) {
            setStatus('Error: ' + err.message, 'error');
          }
        });
      })();
